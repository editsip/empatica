<svg xmlns="http://www.w3.org/2000/svg">
  <!-- Empatica: open contours, displaced planes and a single accent. -->
  <style>
    .sign-accent {
      transform-box: fill-box;
      transform-origin: center;
      transform: translateX(var(--sign-shift, 0px)) rotate(var(--sign-turn, 0deg));
      transition: transform var(--sign-duration, 360ms) cubic-bezier(.2, .7, .25, 1);
    }

    @media (prefers-reduced-motion: reduce) {
      .sign-accent {
        transform: none;
        transition: none;
      }
    }
  </style>
  <symbol id="presenza" viewBox="0 0 40 40">
    <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter">
      <path d="M8 8v14m5-14v11m5-11v8M22 32v-8m5 8V21m5 11V18"/>
      <path class="sign-accent" d="M12 25l15-10" stroke="var(--sign-accent, currentColor)"/>
    </g>
  </symbol>

  <symbol id="relazioni" viewBox="0 0 40 40">
